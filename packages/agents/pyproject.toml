[project]
name = "theoffice-agents"
version = "0.1.0"
description = "Strands agents, Bedrock AgentCore, and Ollama integration."
requires-python = ">=3.12"
dependencies = [
    "theoffice-shared",
    "strands-agents[ollama]",
    "bedrock-agentcore[strands-agents]",
    "strands-agents-tools",
]

[tool.uv.sources]
theoffice-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theoffice_agents"]
