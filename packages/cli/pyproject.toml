[project]
name = "theoffice-cli"
version = "0.1.0"
description = "Command-line interface for theoffice."
requires-python = ">=3.12"
dependencies = [
    "theoffice-shared",
    "theoffice-agents",
    "typer>=0.15,<1",
]

[project.scripts]
theoffice = "theoffice_cli.main:main"

[tool.uv.sources]
theoffice-shared = { workspace = true }
theoffice-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theoffice_cli"]
