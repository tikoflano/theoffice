[project]
name = "theoffice-bff"
version = "0.1.0"
description = "Backend-for-frontend HTTP API."
requires-python = ">=3.12"
dependencies = [
    "theoffice-shared",
    "theoffice-agents",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
theoffice-bff = "theoffice_bff.main:run"

[tool.uv.sources]
theoffice-shared = { workspace = true }
theoffice-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theoffice_bff"]
