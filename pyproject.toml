[project]
name = "theoffice"
version = "0.1.0"
description = "Theoffice monorepo workspace (Python packages)."
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[dependency-groups]
dev = ["poethepoet"]

[tool.poe.tasks]
ping = { shell = "while true; do clear; curl -s -X GET \"${PING_URL:-http://127.0.0.1:8080/ping}\" | jq; sleep 1; done" }

[tool.uv.workspace]
members = ["packages/shared", "packages/agents", "packages/cli", "packages/bff"]
