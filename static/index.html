<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Office</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <link rel="stylesheet" href="/static/office.css">
  <style>
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-gray-900 text-white px-6 py-3 flex items-center gap-3 shrink-0">
    <span class="text-2xl">🏢</span>
    <div>
      <h1 class="font-bold text-base leading-tight">The Office</h1>
      <p class="text-xs text-gray-400">AI Agent Management</p>
    </div>
  </header>

  <!-- Body -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Main area: Phaser canvas + log + input -->
    <main class="flex-1 flex flex-col overflow-hidden">

      <!-- Phaser canvas lives here -->
      <div id="office-floor" class="flex-1 relative overflow-hidden bg-amber-50"></div>

      <!-- Activity log strip -->
      <div id="activity-log"
           class="bg-gray-900 text-green-400 text-xs px-4 py-1.5 font-mono truncate shrink-0 select-none">
        Ready.
      </div>


    </main>
  </div>

  <!-- Context menu (floating, positioned over Phaser canvas) -->
  <div id="ctx-menu" style="display:none;"></div>

  <!-- Hire panel (slides in from right) -->
  <div id="hire-panel" class="hidden fixed right-0 top-0 h-full bg-white shadow-2xl border-l flex flex-col z-50">
    <div class="panel-resize-handle"></div>

    <!-- Panel header -->
    <div class="bg-gray-800 text-white px-4 py-3 flex items-center justify-between shrink-0">
      <div>
        <p class="font-semibold text-sm">Toby Flenderson</p>
        <p class="text-xs text-gray-400">HR Representative</p>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="togglePanelFullscreen('hire-panel')"
                class="panel-fullscreen-btn text-gray-400 hover:text-white text-lg leading-none w-8 h-8 flex items-center justify-center rounded"
                title="Fullscreen">⤢</button>
        <button onclick="closeHirePanel()"
                class="text-gray-400 hover:text-white text-2xl leading-none w-8 h-8 flex items-center justify-center rounded">
          &times;
        </button>
      </div>
    </div>

    <!-- Status bar -->
    <div id="hire-status" class="px-4 py-1.5 text-xs text-gray-500 bg-gray-50 border-b min-h-[28px] flex items-center"></div>

    <!-- Chat area -->
    <div id="hire-chat-area" class="flex-1 flex flex-col overflow-hidden">
      <div id="hire-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <form id="hire-chat-form" class="border-t px-4 py-3 flex gap-2 shrink-0">
        <input id="hire-input" type="text" autocomplete="off" placeholder="Reply to Toby…"
               class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <button type="submit"
                class="bg-blue-500 hover:bg-blue-600 text-white rounded-lg px-4 py-2 text-sm font-medium">
          Send
        </button>
      </form>
    </div>

    <!-- Candidate cards (hidden until candidates are generated) -->
    <div id="hire-candidates" class="hidden flex-1 overflow-y-auto p-4 space-y-3"></div>

  </div>

  <!-- Michael Scott chat panel (slides in from right) -->
  <div id="michael-panel" class="hidden fixed right-0 top-0 h-full bg-white shadow-2xl border-l flex flex-col z-50">
    <div class="panel-resize-handle"></div>
    <div class="bg-blue-900 text-white px-4 py-3 flex items-center justify-between shrink-0">
      <div>
        <p class="font-semibold text-sm">Michael Scott</p>
        <p class="text-xs text-blue-300">Regional Manager</p>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="togglePanelFullscreen('michael-panel')"
                class="panel-fullscreen-btn text-blue-300 hover:text-white text-lg leading-none w-8 h-8 flex items-center justify-center rounded"
                title="Fullscreen">⤢</button>
        <button onclick="closeMichaelPanel()"
                class="text-blue-300 hover:text-white text-2xl leading-none w-8 h-8 flex items-center justify-center rounded">
          &times;
        </button>
      </div>
    </div>
    <div id="michael-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    <form id="michael-chat-form" class="border-t px-4 py-3 flex gap-2 shrink-0">
      <input id="michael-input" type="text" autocomplete="off" placeholder="Talk to Michael…"
             class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <button type="submit"
              class="bg-blue-500 hover:bg-blue-600 text-white rounded-lg px-4 py-2 text-sm font-medium">
        Send
      </button>
    </form>
  </div>

  <!-- Worker direct-chat panel (slides in from right, header filled dynamically) -->
  <div id="worker-panel" class="hidden fixed right-0 top-0 h-full bg-white shadow-2xl border-l flex flex-col z-50">
    <div class="panel-resize-handle"></div>
    <div class="bg-gray-800 text-white px-4 py-3 flex items-center justify-between shrink-0">
      <div>
        <p id="worker-panel-name" class="font-semibold text-sm"></p>
        <p id="worker-panel-role" class="text-xs text-gray-400"></p>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="togglePanelFullscreen('worker-panel')"
                class="panel-fullscreen-btn text-gray-400 hover:text-white text-lg leading-none w-8 h-8 flex items-center justify-center rounded"
                title="Fullscreen">⤢</button>
        <button onclick="closeWorkerPanel()"
                class="text-gray-400 hover:text-white text-2xl leading-none w-8 h-8 flex items-center justify-center rounded">
          &times;
        </button>
      </div>
    </div>
    <div id="worker-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
    <form id="worker-chat-form" class="border-t px-4 py-3 flex gap-2 shrink-0">
      <input id="worker-input" type="text" autocomplete="off" placeholder="Send a message…"
             class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <button type="submit"
              class="bg-blue-500 hover:bg-blue-600 text-white rounded-lg px-4 py-2 text-sm font-medium">
        Send
      </button>
    </form>
  </div>

  <script src="/static/office.js" defer></script>
</body>
</html>
